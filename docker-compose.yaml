services:
  grafana:
    container_name: 'harper-grafana-datasource'

    build:
      args:
        grafana_version: ${GRAFANA_VERSION:-12.3.0}
    volumes:
      - ./dist:/var/lib/grafana/plugins/harper-datasource
      - .:/root/harper-datasource

    environment:
      # The "what's new" splash modal (Grafana 13.0+) covers the page and breaks e2e tests
      GF_FEATURE_TOGGLES_splashScreen: 'false'

    networks:
      - grafana-harper
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana

  harper:
    image: harperfast/harper-pro:5.1.6-node24
    container_name: 'gds-harper'
    user: root
    volumes:
      - ./hdb:/home/harperdb/harper
    networks:
      - grafana-harper
    ports:
      - '49925:9925'
      - '49926:9926'
    environment:
      HDB_ADMIN_USERNAME: admin
      HDB_ADMIN_PASSWORD: foobarbaz
      LOGGING_LEVEL: trace

networks:
  grafana-harper:
